<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Handleliste">
<meta name="theme-color" content="#f5f2ec">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Handleliste v2.5.3 - implisitte anledninger</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maple-mono@1.0.0/index.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f0ece4; --surface: #ffffff; --border: #d4cabf;
    --text: #0f0e0b; --muted: #6b5f52;
    --kiwi: #1e7a2e; --rema: #002070; --meny: #d46000; --andre: #6040b0;
    --beredskap: #b23b3b;
    --hi-kiwi: #c8e8d0; --hi-kiwi-b: #5db87a;
    --hi-rema: #c8d8f0; --hi-rema-b: #5a9ad0;
    --hi-meny: #fde8d0; --hi-meny-b: #e08840;
    --hi-andre: #e4daf5; --hi-andre-b: #9070d0;
    --radius: 10px;
  }
  *, *::before, *::after { box-sizing: border-box; }
@media screen and (max-width: 768px) and (orientation: landscape) {
  html {
    transform: rotate(-90deg);
    transform-origin: left top;
    width: 100vh;
    height: 100vw;
    overflow-x: hidden;
    position: absolute;
    top: 100%;
    left: 0;
  }
}
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 0 0 80px; }

  /* ── ROOM SCREEN ── */
  .room-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 32px 24px; max-width: 400px; margin: 0 auto;
  }
  .room-screen h1 { font-family: 'Maple Mono', monospace; font-weight: 800; font-size: 2rem; letter-spacing: -0.03em; margin-bottom: 8px; }
  .room-screen p { color: var(--muted); font-size: 0.9rem; margin-bottom: 32px; text-align: center; line-height: 1.6; }
  .room-input {
    width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: var(--radius);
    font-family: 'Maple Mono', monospace; font-weight: 700; font-size: 1.4rem;
    text-align: center; letter-spacing: 0.2em; text-transform: uppercase;
    background: var(--surface); color: var(--text); outline: none; margin-bottom: 12px;
  }
  .room-input:focus { border-color: var(--kiwi); }
  .room-btn {
    width: 100%; padding: 14px; border-radius: var(--radius); border: none;
    background: var(--text); color: white; font-family: 'Maple Mono', monospace;
    font-weight: 700; font-size: 1rem; cursor: pointer; margin-bottom: 10px; transition: opacity 0.15s;
  }
  .room-btn:hover { opacity: 0.85; }

  /* ── TOPBAR ── */
  .topbar {
    position: sticky; top: 0; z-index: 50; background: var(--bg);
    border-bottom: 1px solid var(--border); padding: 10px 16px;
    max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
  }
  .topbar h1 { font-family: 'Maple Mono', monospace; font-weight: 800; font-size: 1.2rem; letter-spacing: -0.03em; flex: 1; }

  /* Store tabs – two groups */
  .store-group { display: flex; gap: 4px; }
  .store-group + .store-group { border-left: 1px solid var(--border); padding-left: 8px; }
  .store-btn {
    padding: 5px 13px; border-radius: 100px; border: 2px solid var(--border);
    background: transparent; font-family: 'Maple Mono', monospace; font-weight: 700;
    font-size: 0.78rem; cursor: pointer; color: var(--muted); transition: all 0.18s; white-space: nowrap;
  }
  .store-btn.active[data-store="kiwi"]  { background: var(--kiwi);  border-color: var(--kiwi);  color: white; }
  .store-btn.active[data-store="rema"]  { background: var(--rema);  border-color: var(--rema);  color: white; }
  .store-btn.active[data-store="meny"]  { background: var(--meny);  border-color: var(--meny);  color: white; }
  .store-btn.active[data-store="andre"] { background: var(--andre); border-color: var(--andre); color: white; }
  .store-btn.active[data-store="beredskap"] { background: var(--beredskap); border-color: var(--beredskap); color: white; }

  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: background 0.3s; }
  .sync-dot.synced  { background: var(--kiwi); }
  .sync-dot.syncing { background: #f0a500; animation: pulse 1s infinite; }
  .sync-dot.error   { background: var(--meny); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  button:focus, .item-row:focus, .item-main:focus { outline: none; }
  button:focus-visible { outline: 2px solid var(--kiwi); outline-offset: 2px; }
  .icon-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 2px 5px; border-radius: 8px; color: var(--text); transition: background 0.15s; line-height: 1; }
  .icon-btn:hover { background: var(--border); }
  .icon-btn { position: relative; }
  .occasion-badge {
    position: absolute; top: -2px; right: -2px; min-width: 15px; height: 15px; padding: 0 3px;
    border-radius: 100px; background: var(--beredskap); color: #fff; font-size: 0.6rem;
    font-family: 'Maple Mono', monospace; font-weight: 800; display: none;
    align-items: center; justify-content: center; line-height: 1;
  }

  /* ── SLIDE PANELS ── */
  .slide-panel {
    max-width: 640px; margin: 0 auto; overflow: hidden; max-height: 0;
    transition: max-height 0.3s ease; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .slide-panel.open { max-height: 500px; }
  .slide-panel.open.tall { max-height: 80vh; overflow-y: auto; }
  .slide-panel-inner { padding: 16px; }
  .panel-tabs { display: flex; gap: 5px; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 12px; flex-wrap: wrap; }
  .panel-tab {
    padding: 4px 12px; border-radius: 100px; border: 1px solid var(--border);
    background: transparent; font-family: 'Maple Mono', monospace; font-weight: 600;
    font-size: 0.75rem; cursor: pointer; color: var(--muted);
  }
  .panel-tab.active { background: var(--text); color: white; border-color: var(--text); }
  .panel-section { display: none; }
  .panel-section.active { display: block; }

  textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px;
    font-family: 'DM Sans', sans-serif; font-size: 1rem; line-height: 1.6;
    background: var(--bg); color: var(--text); resize: vertical; min-height: 100px; outline: none;
  }
  textarea:focus { border-color: var(--kiwi); }
  .export-textarea { min-height: 80px !important; font-size: 0.75rem !important; font-family: monospace !important; }
  .panel-actions { display: flex; gap: 8px; margin-top: 10px; }
  .action-btn {
    flex: 1; padding: 10px; border-radius: 8px; border: none;
    font-family: 'Maple Mono', monospace; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: opacity 0.15s;
  }
  .action-btn.primary { background: var(--text); color: white; }
  .action-btn.secondary { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
  .action-btn:hover { opacity: 0.85; }

  /* ── LIST ── */
  #result { max-width: 640px; margin: 0 auto; padding: 8px 16px 16px; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .emoji { font-size: 2.5rem; margin-bottom: 12px; }
  .empty-state p { font-size: 0.9rem; line-height: 1.6; }

  .section-header {
    font-family: 'Maple Mono', monospace; font-weight: 800; font-size: 0.78rem;
    letter-spacing: 0.075em; text-transform: uppercase; color: var(--text);
    padding: 10px 0 5px; border-bottom: 2px solid var(--border); margin-bottom: 4px; margin-top: 16px;
  }
  .section-header.in-vogna { margin-top: 32px; opacity: 0.5; }

  /* ── ITEM ROW ── */
  .item-row {
    display: flex; align-items: center; gap: 0;
    border-radius: 8px; margin-bottom: 3px;
    border: 1px solid transparent; overflow: hidden;
  }
  .item-main {
    display: flex; align-items: center; gap: 10px;
    flex: 1; padding: 8px 10px; cursor: pointer; transition: background 0.15s;
  }
  .item-row:hover .item-main { background: var(--bg); }
  .item-row.highlighted { border-color: transparent; }
  .item-row.highlighted[data-store="kiwi"]  { background: var(--hi-kiwi);  border-color: var(--hi-kiwi-b); }
  .item-row.highlighted[data-store="rema"]  { background: var(--hi-rema);  border-color: var(--hi-rema-b); }
  .item-row.highlighted[data-store="meny"]  { background: var(--hi-meny);  border-color: var(--hi-meny-b); }
  .item-row.highlighted[data-store="andre"] { background: transparent; border-color: transparent; }

  .item-name { flex: 1; font-size: 0.92rem; font-family: 'DM Sans', sans-serif; }
  .item-row.in-vogna .item-name { text-decoration: line-through; color: var(--muted); }

  .check-circle {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .item-row.in-vogna .check-circle { background: var(--muted); border-color: var(--muted); }
  .check-circle::after {
    content: ''; display: block; width: 5px; height: 9px;
    border: 2px solid white; border-top: none; border-left: none;
    transform: rotate(45deg) translate(-1px, -1px); opacity: 0;
  }
  .item-row.in-vogna .check-circle::after { opacity: 1; }

  /* Store picker button */
  .store-picker-btn {
    flex-shrink: 0; width: 40px; min-height: 40px;
    border: none; border-left: 1px solid var(--border);
    background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem; font-family: 'Maple Mono', monospace; font-weight: 700;
    color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase;
    transition: background 0.15s; padding: 0;
  }
  .store-picker-btn:hover { background: var(--bg); }
  .store-picker-btn.has-kiwi  { color: var(--kiwi); }
  .store-picker-btn.has-rema  { color: var(--rema); }
  .store-picker-btn.has-meny  { color: var(--meny); }
  .store-picker-btn.has-andre { color: var(--andre); }

  .item-main { position: relative; padding-right: 46px; }
  .edit-zone {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(15,14,11,0.16);
    background: rgba(255,255,255,0.88); color: var(--text); box-shadow: 0 1px 4px rgba(15,14,11,0.08);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    padding: 0; font-family: 'Maple Mono', monospace; font-weight: 900; font-size: 1.18rem;
    line-height: 1; transition: transform 0.15s, background 0.15s, border-color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .edit-zone:hover { background: var(--surface); border-color: rgba(15,14,11,0.32); transform: translateY(-50%) scale(1.04); }
  .edit-zone .edit-icon { display: block; transform: translateY(-1px); letter-spacing: -0.08em; }
  .item-row.highlighted .edit-zone { background: rgba(255,255,255,0.92); border-color: rgba(15,14,11,0.22); color: var(--text); }
  .item-row.in-vogna .item-main { padding-right: 10px; }
  .place-btn {
    font-size: 0.72rem; padding: 2px 8px; border-radius: 100px;
    border: 1px dashed var(--border); background: transparent; color: var(--muted);
    cursor: pointer; font-family: 'DM Sans', sans-serif; white-space: nowrap; flex-shrink: 0;
  }
  .place-btn:hover { border-color: var(--kiwi); color: var(--kiwi); }

  /* ── BOTTOM BAR ── */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface);
    border-top: 1px solid var(--border); padding: 10px 16px; display: flex; gap: 8px;
    max-width: 640px; margin: 0 auto;
  }
  .bottom-btn {
    flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; font-family: 'Maple Mono', monospace; font-weight: 600;
    font-size: 0.8rem; cursor: pointer; color: var(--muted); transition: all 0.15s;
  }
  .bottom-btn:hover { background: var(--bg); }
  .bottom-btn.danger { color: var(--meny); border-color: var(--meny); }
  .bottom-btn.danger:hover { background: var(--hi-meny); }

  /* ── MODALS ── */
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: flex-end; justify-content: center; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--surface); border-radius: 16px 16px 0 0; padding: 20px 16px 40px; width: 100%; max-width: 640px; max-height: 80vh; overflow-y: auto; overscroll-behavior: contain; }
  .modal-title { font-family: 'Maple Mono', monospace; font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
  .modal-subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
  .modal-option {
    display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 6px;
    border-radius: 8px; border: 1px solid var(--border); background: transparent;
    font-family: 'DM Sans', sans-serif; font-size: 0.9rem; cursor: pointer; transition: all 0.15s; color: var(--text);
  }
  .modal-option:hover { background: var(--hi-kiwi); border-color: var(--hi-kiwi-b); }
  .modal-option.active-store { font-weight: 600; }
  .modal-option[data-store="kiwi"].active-store  { background: var(--hi-kiwi);  border-color: var(--kiwi); }
  .modal-option[data-store="rema"].active-store  { background: var(--hi-rema);  border-color: var(--rema); }
  .modal-option[data-store="meny"].active-store  { background: var(--hi-meny);  border-color: var(--meny); }
  .modal-option[data-store="andre"].active-store { background: var(--hi-andre); border-color: var(--andre); }
  .modal-cancel { display: block; width: 100%; margin-top: 8px; padding: 12px; border-radius: 8px; border: none; background: var(--bg); font-family: 'Maple Mono', monospace; font-weight: 600; font-size: 0.85rem; cursor: pointer; color: var(--muted); }

  /* Section picker in modal */
  .section-option { display: block; width: 100%; text-align: left; padding: 11px 14px; margin-bottom: 4px; border-radius: 8px; border: 1px solid var(--border); background: transparent; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; cursor: pointer; transition: all 0.15s; color: var(--text); }
  .section-option:hover { background: var(--hi-kiwi); border-color: var(--hi-kiwi-b); }

  /* ── SETTINGS ── */
  .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .settings-row:last-child { border-bottom: none; }
  .settings-label { color: var(--muted); font-size: 0.75rem; font-family: 'Maple Mono', monospace; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  .settings-value { font-weight: 500; font-size: 0.88rem; }
  .settings-link { color: var(--rema); font-size: 0.82rem; cursor: pointer; text-decoration: underline; background: none; border: none; font-family: 'DM Sans', sans-serif; }

  /* ── CATEGORY EDITOR ── */
  .cat-list { display: flex; flex-direction: column; gap: 6px; }
  .cat-row { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; cursor: grab; user-select: none; }
  .cat-row.dragging { opacity: 0.4; }
  .cat-row.drag-over { border-color: var(--kiwi); background: var(--hi-kiwi); }
  .drag-handle { color: var(--border); font-size: 1rem; flex-shrink: 0; }
  .cat-name-input { flex: 1; border: none; background: transparent; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; color: var(--text); outline: none; min-width: 0; }
  .cat-move-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 0.6rem; padding: 1px 3px; line-height: 1; border-radius: 3px; }
  .cat-move-btn:hover { background: var(--border); }
  .cat-move-btn:disabled { opacity: 0.2; cursor: default; }
  .cat-delete-btn { background: none; border: none; cursor: pointer; color: var(--border); font-size: 1rem; padding: 0 2px; flex-shrink: 0; transition: color 0.15s; }
  .cat-delete-btn:hover { color: var(--meny); }
  .cat-save-row { display: flex; gap: 8px; margin-top: 10px; }
  .cat-add-btn { flex: 1; padding: 9px; border-radius: 8px; border: 1px dashed var(--border); background: transparent; font-family: 'Maple Mono', monospace; font-weight: 600; font-size: 0.82rem; cursor: pointer; color: var(--muted); }
  .cat-save-btn { flex: 1; padding: 9px; border-radius: 8px; border: none; background: var(--kiwi); color: white; font-family: 'Maple Mono', monospace; font-weight: 700; font-size: 0.82rem; cursor: pointer; }

  .add-store-selector { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .add-store-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .add-store-btn {
    padding: 7px 14px; border-radius: 100px; border: 2px solid var(--border);
    background: transparent; font-family: 'Maple Mono', monospace; font-weight: 600;
    font-size: 0.8rem; cursor: pointer; color: var(--muted); transition: all 0.15s;
  }
  .add-store-btn.active[data-group="dagligvare"],
  .add-store-btn.active[data-group="andre"] { background: var(--text); border-color: var(--text); color: white; }
  .add-store-btn.active[data-addstore="kiwi"]  { background: var(--kiwi);  border-color: var(--kiwi);  color: white; }
  .add-store-btn.active[data-addstore="rema"]  { background: var(--rema);  border-color: var(--rema);  color: white; }
  .add-store-btn.active[data-addstore="meny"]  { background: var(--meny);  border-color: var(--meny);  color: white; }
  .add-store-btn.active[data-addstore="andre"] { background: var(--andre); border-color: var(--andre); color: white; }


  .filter-bar { max-width: 640px; margin: 0 auto; padding: 8px 16px 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-chip { padding: 6px 11px; border-radius: 100px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: 'Maple Mono', monospace; font-weight: 700; font-size: 0.72rem; white-space: nowrap; cursor: pointer; }
  .filter-chip.active { background: var(--text); border-color: var(--text); color: white; box-shadow: 0 1px 5px rgba(15,14,11,0.13); }
  .filter-chip.base { border-style: solid; }
  .filter-chip.add { border-style: dashed; }
  .occasion-emoji-input { width: 56px; flex: 0 0 56px; text-align: center; font-size: 1.15rem; }
  .occasion-name-input { flex: 1; min-width: 0; }
  .panel-help { color: var(--muted); font-size: 0.85rem; line-height: 1.5; margin-bottom: 12px; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 0; }
  .meta-grid.single { grid-template-columns: 1fr; }
  .field-label { display:block; font-family:'Maple Mono',monospace; font-weight:800; font-size:0.79rem; text-transform:uppercase; letter-spacing:0.075em; color:var(--text); margin: 12px 0 6px; }
  .text-input, .select-input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.95rem; outline: none; }
  .text-input:focus, .select-input:focus { border-color: var(--kiwi); }
  .occasion-card, .context-card, .maintenance-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin: 8px 0 14px; overflow: hidden; }
  .occasion-card h2, .context-card h2, .maintenance-card h2 { margin: 0 0 10px; font-family: 'Maple Mono', monospace; font-size: 1.08rem; letter-spacing: -0.02em; }
  .occasion-note { min-height: 74px; margin-bottom: 10px; display: block; }
  .todo-add-row { display:flex; gap: 8px; margin: 8px 0 10px; }
  .todo-add-row input { flex: 1; }
  .small-btn { border: 1px solid var(--border); background: var(--bg); color: var(--muted); border-radius: 8px; padding: 7px 10px; font-family: 'Maple Mono', monospace; font-weight: 700; cursor: pointer; }
  .todo-row { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid rgba(212,202,191,0.55); }
  .todo-row:last-child { border-bottom:none; }
  .todo-row.done .todo-text { color: var(--muted); text-decoration: line-through; }
  .todo-check { width:22px; height:22px; border-radius:50%; border:2px solid var(--border); background:transparent; cursor:pointer; flex-shrink:0; }
  .todo-row.done .todo-check { background: var(--muted); border-color: var(--muted); }
  .todo-text { flex:1; font-size:0.92rem; }
  .todo-actions { display:flex; gap:3px; }
  .tiny-btn { border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:0.75rem; padding:2px 4px; }
  .item-meta { display:flex; gap:5px; flex-wrap:wrap; margin-top:2px; }
  .item-pill { font-size:0.68rem; border:1px solid var(--border); color:var(--muted); border-radius:100px; padding:1px 6px; }
  .item-content { display:flex; flex-direction:column; flex:1; min-width:0; }
  .maintenance-grid { display:grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap:8px; margin-bottom:10px; }
  .metric { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:9px; }
  .metric strong { display:block; font-size:1.05rem; }
  .metric span { color:var(--muted); font-size:0.72rem; font-family:'Maple Mono',monospace; text-transform:uppercase; }

<script>
// CONFIG
const EDGE_FUNCTION_URL = 'https://vkhktataxypuobrzslbi.supabase.co/functions/v1/shopping-room';
const BEREDSKAP_OCCASION_ID = 'e6a83052-f7d0-453f-8f59-a5ae92ae03bc';

async function api(action, token, payload = null) {
  const res = await fetch(EDGE_FUNCTION_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, token, payload })
  });
  const text = await res.text();
  let json = {};
  try { json = text ? JSON.parse(text) : {}; } catch (e) { json = { error: text || 'Ugyldig svar fra server' }; }
  if (!res.ok && !json.error) json.error = 'HTTP ' + res.status;
  return json;
}

// DEFAULT DATA
const defaultKiwiSections = [
  { id: 'k0',  label: '🥤 Småbrus',                 keywords: ['brus','cola','pepsi','fanta','soda','mineralvann','juice','smoothie','saft'] },
  { id: 'k1',  label: '🥕 Frukt og grønt',           keywords: ['frukt','grønt','eple','banan','appelsin','tomat','agurk','løk','hvitløk','salat','paprika','gulrot','sitron','lime','jordbær','blåbær','mango','avokado','spinat','brokkoli','blomkål','squash','sopp','purre','selleri'] },
  { id: 'k11', label: '🍞 Brød',                     keywords: ['brød','knekkebrød','rundstykke','lefse','loff','bagett','croissant'] },
  { id: 'k2',  label: '🍯 Pålegg',                   keywords: ['syltetøy','makrell','honning','jam','marmelade','peanøtt','nøttesmør','leverpostei','skinke','salami','servelat','kaviar','tunfisk','sardiner'] },
  { id: 'k3',  label: '🧀 Ost',                      keywords: ['ost','jarlsberg','norvegia','brie','camembert','fetaost','feta','kremost','brunost','gudbrandsdalsost'] },
  { id: 'k4',  label: '🥩 Kjøtt',                    keywords: ['kjøtt','kylling','biff','svin','bacon','pølse','laks','fisk','reke','koteletter','karbonader','hamburgere'] },
  { id: 'k5',  label: '🥛 Meieri og krydder',        keywords: ['melk','fløte','rømme','yoghurt','ketchup','sennep','krydder','pepper','salt','oregano','basilikum','paprikapulver','karri','timian','rosmarin','ingefær','kanel','soya','tabasco','sukker','vanilje'] },
  { id: 'k6',  label: '🌮 Taco og pasta og sånt',    keywords: ['taco','pasta','nudler','ris','spaghetti','penne','lasagne','makaroni','couscous','quinoa','linser','bønner','kikerter','salsa','tacokrydder','wrap','tortilla'] },
  { id: 'k7',  label: '🥚 Egg og majones',           keywords: ['egg','majones'] },
  { id: 'k8',  label: '🥶 Frysevarer',               keywords: ['frys','frossen','frosne','iskrem','pommes','frites'] },
  { id: 'k9',  label: '🧻 Hygiene',                  keywords: ['toalettpapir','tørkerull','tannkrem','tannbørste','shampoo','såpe','deodorant','barbering','hårvask','vaskemiddel','oppvask','oppvaskmiddel','rengjøring','klut'] },
  { id: 'k10', label: '🥫 Hermetikk og dessert',     keywords: ['tomatsaus','ananas','hermetikk','dessert','puddingpulver','gelatin','kakao','sjokoladepulver'] },
  { id: 'k13', label: '🫙 Bakevarer',                keywords: ['mel','bakepulver','gjær','havregryn','müsli','frokostblanding','cornflakes','kake','kakemiks'] },
  { id: 'k12', label: '🍫 Digg',                     keywords: ['sjokolade','snop','godteri','chips','popcorn','nøtter','mandel','valnøtt','cashew','rosiner','kjeks','småkake'] },
];

const defaultAndreSections = [
  { id: 'a0', label: 'Apotek',    keywords: [] },
  { id: 'a1', label: 'Clas',      keywords: [] },
  { id: 'a2', label: 'Helsekost', keywords: [] },
  { id: 'a3', label: 'Ikea',      keywords: [] },
];

// STATE
let kiwiSections = JSON.parse(JSON.stringify(defaultKiwiSections));
let andreSections = JSON.parse(JSON.stringify(defaultAndreSections));
let listItems = [];
let occasions = [];
let preferences = { itemPlacements: {} };
let currentStore = 'kiwi';
let activeOccasionFilters = new Set();
let currentRoomCode = null;
let openPanel = null;
let saveTimeout = null;
let pollInterval = null;
let isSaving = false;
let localDirtySinceLoad = false;
let lastDataHash = null;
let activeItemId = null;
let addGroup = 'dagligvare';
let addStore = 'kiwi';
let addOccasionId = null;
let placementSearch = '';
let perfLog = [];
let collapsedSections = new Set();
let dragSrcIdx = null;

function genId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}
function nowIso() { return new Date().toISOString(); }
function h(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function parseMaybeJson(value, fallback) {
  if (value === null || value === undefined || value === '') return fallback;
  if (typeof value === 'string') { try { return JSON.parse(value); } catch (e) { return fallback; } }
  if (typeof value === 'object') return value;
  return fallback;
}
function normalizeItemName(text) { return String(text || '').toLowerCase().trim().replace(/\s+/g, ' '); }
function bytesOf(str) { return new Blob([String(str || '')]).size; }
function markPerf(label, extra = '') {
  perfLog.unshift({ at: new Date().toLocaleTimeString('no-NO'), label, extra });
  perfLog = perfLog.slice(0, 40);
}
function getOccasion(id) { return occasions.find(o => o.id === id) || null; }
function activeOccasions() { return occasions.slice().sort((a,b)=>(a.sortOrder || 0) - (b.sortOrder || 0)); }
function guessOccasionEmoji(name) {
  const n = normalizeItemName(name);
  if (!n) return '';
  if (n.includes('17') || n.includes('mai') || n.includes('nasjonal')) return '🇳🇴';
  if (n.includes('sommer') || n.includes('sol')) return '☀️';
  if (n.includes('jul')) return '🎄';
  if (n.includes('hytte') || n.includes('hytta')) return '🏕️';
  if (n.includes('ferie') || n.includes('reise') || n.includes('tur')) return '✈️';
  if (n.includes('gave') || n.includes('gaver')) return '🎁';
  if (n.includes('bursdag')) return '🎂';
  if (n.includes('påske') || n.includes('paske')) return '🐣';
  if (n.includes('halloween')) return '🎃';
  if (n.includes('vinter')) return '❄️';
  return '';
}
function occasionLabel(o) {
  if (!o) return '';
  const emoji = String(o.emoji || '').trim();
  return (emoji ? emoji + ' ' : '') + o.name;
}
function selectedOccasions() { return activeOccasions().filter(o => activeOccasionFilters.has(o.id)); }
function hasActiveOccasionFilters() { return activeOccasionFilters.size > 0; }
function normalizeEmojiInput(value) { return String(value || '').trim(); }

// ROOM CODE STORAGE
function saveRoomCode(code) {
  try { localStorage.setItem('lastRoomCode', code); } catch(e) {}
  try { sessionStorage.setItem('lastRoomCode', code); } catch(e) {}
  history.replaceState(null, '', '#' + code);
}
function getSavedRoomCode() {
  const hash = window.location.hash.replace('#','').trim();
  if (hash && hash.length >= 24) return hash;
  try { const s = sessionStorage.getItem('lastRoomCode'); if (s && s.length >= 24) return s; } catch(e) {}
  try { const s = localStorage.getItem('lastRoomCode'); if (s && s.length >= 24) return s; } catch(e) {}
  return null;
}
function clearRoomCode() {
  try { localStorage.removeItem('lastRoomCode'); } catch(e) {}
  try { sessionStorage.removeItem('lastRoomCode'); } catch(e) {}
  history.replaceState(null, '', window.location.pathname);
}
function cacheKey(code) { return 'handleliste.cache.' + String(code || '').slice(0, 32); }
function rowFromState() {
  return {
    data: JSON.stringify({ items: listItems, occasions }),
    categories: JSON.stringify({ kiwi: kiwiSections, andre: andreSections }),
    preferences
  };
}
function saveRoomCache(row = null) {
  if (!currentRoomCode) return;
  try { localStorage.setItem(cacheKey(currentRoomCode), JSON.stringify(row || rowFromState())); } catch(e) {}
}
function loadRoomCache(code) {
  try { const raw = localStorage.getItem(cacheKey(code)); return raw ? JSON.parse(raw) : null; } catch(e) { return null; }
}
function getRowHash(row) {
  return JSON.stringify(parseMaybeJson(row?.data, {})) + JSON.stringify(parseMaybeJson(row?.categories, {})) + JSON.stringify(parseMaybeJson(row?.preferences, {}));
}
function getLocalHash() {
  return JSON.stringify({ items: listItems, occasions }) + JSON.stringify({ kiwi: kiwiSections, andre: andreSections }) + JSON.stringify(preferences || {});
}

function ensureDefaultKiwiCategories() {
  if (!preferences || typeof preferences !== 'object') preferences = { itemPlacements: {} };
  if (preferences.kiwiCategoryVersion === 2) return;
  const defaultsById = new Map(defaultKiwiSections.map(sec => [sec.id, sec]));
  const oldLabelsById = {
    k0: ['Småbrus'], k1: ['Frukt og grønt'], k2: ['Pålegg'], k3: ['Ost'], k4: ['Kjøtt'],
    k5: ['Meieri og krydder'], k6: ['Taco og pasta og sånt'], k7: ['Egg og majones'],
    k8: ['Frysevarer'], k9: ['Hygiene'], k10: ['Hermetikk og dessert'], k11: ['Bakevarer','Brød'], k12: ['Digg']
  };
  const existingById = new Map(kiwiSections.map(sec => [sec.id, sec]));
  defaultKiwiSections.forEach(def => {
    const existing = existingById.get(def.id);
    if (existing) {
      const plain = String(existing.label || '').replace(/^\p{Extended_Pictographic}[️]?\s*/u, '').trim();
      const known = (oldLabelsById[def.id] || []).includes(plain) || existing.label === def.label;
      if (known) existing.label = def.label;
      if (!Array.isArray(existing.keywords) || !existing.keywords.length) existing.keywords = def.keywords;
    } else {
      kiwiSections.push(JSON.parse(JSON.stringify(def)));
    }
  });
  const preferred = new Map(defaultKiwiSections.map((sec, idx) => [sec.id, idx]));
  kiwiSections.sort((a, b) => {
    const ai = preferred.has(a.id) ? preferred.get(a.id) : 1000;
    const bi = preferred.has(b.id) ? preferred.get(b.id) : 1000;
    return ai - bi;
  });
  preferences.kiwiCategoryVersion = 2;
}

function normalizeState() {
  if (!Array.isArray(listItems)) listItems = [];
  if (!Array.isArray(occasions)) occasions = [];
  listItems.forEach(item => {
    if (!item.id) item.id = genId();
    if (typeof item.text !== 'string') item.text = String(item.text || '');
    if (!item.store) item.store = 'kiwi';
    if (typeof item.checked !== 'boolean') item.checked = !!item.checked;
    if (!('occasionId' in item)) item.occasionId = null;
  });
  occasions.forEach((o, i) => {
    if (!o.id) o.id = genId();
    if (!o.name) o.name = 'Anledning ' + (i + 1);
    if (!('emoji' in o)) o.emoji = guessOccasionEmoji(o.name);
    if (!('sortOrder' in o)) o.sortOrder = i;
  });
  if (!preferences || typeof preferences !== 'object') preferences = { itemPlacements: {} };
  if (!preferences.itemPlacements || typeof preferences.itemPlacements !== 'object') preferences.itemPlacements = {};
  ensureDefaultKiwiCategories();
  activeOccasionFilters = new Set([...activeOccasionFilters].filter(id => !!getOccasion(id)));
  if (preferences.schemaVersion !== 1) migrateToSchemaV1();
}

function migrateToSchemaV1() {
  const isBeredskap = item =>
    item.occasionId === BEREDSKAP_OCCASION_ID || normalizeItemName(item.text).includes('beredskap');
  listItems.forEach(item => {
    if (isBeredskap(item)) { item.store = 'beredskap'; item.occasionId = null; }
  });
  occasions = occasions.filter(o => o.id !== BEREDSKAP_OCCASION_ID);
  occasions.forEach(o => { delete o.notes; delete o.archived; });
  listItems.forEach(i => { delete i.contextId; });
  preferences.schemaVersion = 1;
}

// SUPABASE EDGE FUNCTION FLOW
async function createRoom() {
  if (currentRoomCode && !confirm('Lag et nytt rom? Du mister tilgang til det nåværende.')) return;
  const tokenBytes = new Uint8Array(32);
  crypto.getRandomValues(tokenBytes);
  const token = Array.from(tokenBytes).map(b => b.toString(16).padStart(2, '0')).join('');
  setSyncStatus('syncing');
  try {
    const result = await api('create', token, { categories: { kiwi: defaultKiwiSections, andre: defaultAndreSections } });
    if (result.error) throw new Error(result.error);
    await enterRoom(token, result.data);
    navigator.clipboard.writeText(location.href).catch(() => {});
    alert('Ny handleliste opprettet. Lenken er kopiert til utklippstavlen.');
  } catch (e) { setSyncStatus('error'); alert('Feil: ' + e.message); }
}
async function joinRoom() {
  let token = window.location.hash.replace('#', '').trim() || document.getElementById('roomCodeInput').value.trim();
  if (token.includes('#')) token = token.split('#').pop().trim();
  if (!token) return;
  currentRoomCode = token;
  saveRoomCode(token);
  setSyncStatus('syncing');
  const cached = loadRoomCache(token);
  let shownFromCache = false;
  if (cached) {
    loadFromRow(cached);
    showApp();
    startPolling();
    shownFromCache = true;
    markPerf('Viste lokal cache');
  }
  try {
    const start = performance.now();
    const result = await api('load', token);
    markPerf('Server-load', Math.round(performance.now() - start) + ' ms');
    if (!result.data) {
      if (!shownFromCache) { alert('Fant ikke liste'); setSyncStatus('error'); }
      return;
    }
    if (shownFromCache && localDirtySinceLoad) { await saveToCloud(); return; }
    await enterRoom(token, result.data);
  } catch (e) {
    if (!shownFromCache) alert('Tilkoblingsfeil. Prøv igjen.');
    setSyncStatus('error');
  }
}
async function enterRoom(code, row = null) {
  currentRoomCode = code;
  saveRoomCode(code);
  if (!row) {
    const result = await api('load', code);
    if (result.error) throw new Error(result.error);
    row = result.data;
  }
  if (row) loadFromRow(row);
  showApp();
  startPolling();
}
function loadFromRow(row) {
  const d = parseMaybeJson(row?.data, {});
  if (d.items && d.items.length && d.items[0].id) {
    listItems = d.items;
  } else if (d.items) {
    const storeData = d.storeData || {};
    const checkedItems = d.checkedItems || {};
    listItems = d.items.map(item => {
      const key = String(item.text || '').toLowerCase().trim();
      const sd = storeData[key] || {};
      let store = sd.store || (sd.stores && sd.stores[0]) || 'kiwi';
      if (sd.stores && sd.stores.includes('andre')) store = 'andre';
      return { id: genId(), text: item.text, store, kiwiSection: sd.kiwiSection || null, andreSection: sd.andreSection || null, checked: checkedItems[key] || false, occasionId: null };
    });
  } else listItems = [];
  occasions = Array.isArray(d.occasions) ? d.occasions : [];
  const cats = parseMaybeJson(row?.categories, null);
  if (cats) {
    if (Array.isArray(cats.kiwi)) kiwiSections.splice(0, kiwiSections.length, ...cats.kiwi);
    if (Array.isArray(cats.andre)) andreSections.splice(0, andreSections.length, ...cats.andre);
  }
  preferences = parseMaybeJson(row?.preferences, { itemPlacements: {} });
  normalizeState();
  lastDataHash = getRowHash(row);
  localDirtySinceLoad = false;
  saveRoomCache(rowFromState());
  markPerf('Parse/cache', bytesOf(JSON.stringify(rowFromState())) + ' bytes');
}
function showApp() {
  document.getElementById('roomScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  const display = document.getElementById('displayRoomCode');
  if (display) display.textContent = currentRoomCode;
  updateStoreButtons();
  setSyncStatus('synced');
  renderList();
}
function leaveRoom() {
  clearInterval(pollInterval);
  currentRoomCode = null;
  clearRoomCode();
  listItems = []; occasions = [];
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('roomScreen').classList.remove('hidden');
  document.getElementById('roomCodeInput').value = '';
  closePanel();
}
function copyRoomCode() {
  navigator.clipboard.writeText(currentRoomCode).catch(()=>{});
  const btn = document.querySelector('#tab-rom .settings-link');
  if (!btn) return;
  const old = btn.textContent;
  btn.textContent = 'Kopiert';
  setTimeout(() => btn.textContent = old, 2000);
}
function setSyncStatus(s) {
  const d = document.getElementById('syncDot');
  if (d) d.className = 'sync-dot ' + s;
}
async function saveToCloud() {
  if (!currentRoomCode) return;
  isSaving = true;
  setSyncStatus('syncing');
  try {
    normalizeState();
    const dataStr = JSON.stringify({ items: listItems, occasions });
    const catStr = JSON.stringify({ kiwi: kiwiSections, andre: andreSections });
    const prefStr = JSON.stringify(preferences || {});
    const result = await api('save', currentRoomCode, { data: dataStr, categories: catStr, preferences });
    if (result.error) throw new Error(result.error);
    lastDataHash = dataStr + catStr + prefStr;
    localDirtySinceLoad = false;
    saveRoomCache({ data: dataStr, categories: catStr, preferences });
    setSyncStatus('synced');
  } catch (e) { setSyncStatus('error'); }
  finally { isSaving = false; }
}
function scheduleSave() {
  normalizeState();
  localDirtySinceLoad = true;
  saveRoomCache(rowFromState());
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => { await saveToCloud(); saveTimeout = null; }, 600);
}
async function pollCloud() {
  if (!currentRoomCode || isSaving || saveTimeout) return;
  try {
    const result = await api('load', currentRoomCode);
    if (!result.data) return;
    const hash = getRowHash(result.data);
    if (hash !== lastDataHash) {
      lastDataHash = hash;
      loadFromRow(result.data);
      renderList();
      setSyncStatus('synced');
    }
  } catch (e) { setSyncStatus('error'); }
}
function startPolling() { clearInterval(pollInterval); pollInterval = setInterval(pollCloud, 5000); }

// PANELS AND TABS
function closePanel() {
  if (openPanel) document.getElementById('panel-' + openPanel).classList.remove('open');

}
function switchTab(tab) {

  document.querySelectorAll('.panel-section').forEach(s => s.classList.toggle('active', s.id === 'tab-' + tab));

function togglePanel(name) {
  if (openPanel === name) { closePanel(); return; }
  ['add','settings','occasions'].forEach(p => document.getElementById('panel-' + p).classList.remove('open'));
  openPanel = name;
  document.getElementById('panel-' + name).classList.add('open');
  if (name === 'settings') switchTab('rom');
  if (name === 'occasions') { document.getElementById('panel-occasions').classList.add('tall'); renderOccasionPanel(); }

    else { addGroup = 'dagligvare'; addStore = ['kiwi','rema','meny'].includes(currentStore) ? currentStore : 'kiwi'; }

}

function addItems() {

// OCCASIONS
function renderOccasionOptions(selectedId, emptyLabel) {
  return `<option value="">${h(emptyLabel)}</option>` + activeOccasions().map(o => `<option value="${h(o.id)}" ${o.id===selectedId?'selected':''}>${h(occasionLabel(o))}</option>`).join('');

function setOccasionFilter(id) {
  if (!id) activeOccasionFilters.clear();

function addOccasionFromNext() {
  const nameInput = document.getElementById('newOccasionName');
  const emojiInput = document.getElementById('newOccasionEmoji');
  const name = nameInput ? nameInput.value.trim() : '';
  if (!name) return;
  const emoji = normalizeEmojiInput(emojiInput ? emojiInput.value : '') || guessOccasionEmoji(name);
  occasions.push({ id: genId(), name, emoji, sortOrder: occasions.length, createdAt: nowIso() });

  if (emojiInput) emojiInput.value = '';

}
function updateOccasionName(id, value) {
  const o = getOccasion(id);

  if (!o.emoji) o.emoji = guessOccasionEmoji(o.name);

  scheduleSave();
}
function updateOccasionEmoji(id, value) {
  const o = getOccasion(id);
  if (!o) return;
  o.emoji = normalizeEmojiInput(value);
  renderOccasionPanel();
  renderList();
  scheduleSave();
}
function deleteOccasion(id) {
  const o = getOccasion(id);
  if (!o || !confirm('Slette anledningen? Varer kobles fra.')) return;
  occasions = occasions.filter(x => x.id !== id);
  listItems.forEach(item => { if (item.occasionId === id) item.occasionId = null; });
  activeOccasionFilters.delete(id);
  if (openPanel === 'occasions') renderOccasionPanel();

// RENDERING
function getSavedPlacement(text) { return preferences.itemPlacements[normalizeItemName(text)] || null; }
function rememberPlacement(item) {
  const key = normalizeItemName(item.text);
  if (!key) return;
  preferences.itemPlacements[key] = { store: item.store, kiwiSection: item.kiwiSection || null, andreSection: item.andreSection || null, updatedAt: nowIso() };
}
function isInActiveShoppingScope(item) {
  if (hasActiveOccasionFilters()) return !item.occasionId || activeOccasionFilters.has(item.occasionId);
  return !item.occasionId;
}
function getScopedItems() {
  return listItems.filter(isInActiveShoppingScope);
}
function renderList() {
  const start = performance.now();
  normalizeState();
  const container = document.getElementById('result');
  const bottomBar = document.getElementById('bottomBar');
  if (!container) return;
  const scoped = getScopedItems();
  bottomBar.style.display = scoped.some(i => i.checked) ? 'flex' : 'none';
  const occBtn = document.getElementById('occasionBtn');
  if (occBtn) occBtn.style.display = currentStore === 'beredskap' ? 'none' : 'inline-flex';
  if (currentStore === 'beredskap') renderBeredskap(container, scoped);
  else if (currentStore === 'andre') renderAndre(container, scoped);
  else renderGrocery(container, scoped);
  updateOccasionBadge();
  markPerf('Render', Math.round(performance.now() - start) + ' ms');
}
function hasOccasionItems(occasionId) { return listItems.some(i => i.occasionId === occasionId); }
function primaryEmptyText() {
  return listItems.some(i => i.occasionId)
    ? 'Ingen vanlige varer i denne butikkvisningen. Trykk på en anledning over for å vise anledningsvarer.'
    : 'Trykk <strong>+</strong> for å legge til varer.';
}
function occasionEmptyText() {
  return 'Ingen varer er knyttet til denne anledningen ennå.<br>For å knytte en vare til en anledning, rediger varen i handlelisten.';
}
function storeOccasionEmptyText() {
  const chosen = selectedOccasions();
  if (chosen.length === 1 && !hasOccasionItems(chosen[0].id)) return occasionEmptyText();
  const names = chosen.map(o => h(occasionLabel(o))).join(', ');
  return 'Ingen vanlige varer' + (names ? ' eller varer fra ' + names : '') + ' i denne butikkvisningen.';
}
function renderGrocery(container, items) {
  const sections = {}, unknown = [], vogna = [];
  for (const item of items) {
    if (item.store === 'andre') continue;
    const saved = getSavedPlacement(item.text);
    const sectionId = item.kiwiSection || saved?.kiwiSection || null;
    const highlight = item.store === currentStore;
    if (item.checked) { vogna.push({ ...item, sectionId, highlight }); continue; }
    if (sectionId) { if (!sections[sectionId]) sections[sectionId] = []; sections[sectionId].push({ ...item, sectionId, highlight }); }
    else unknown.push({ ...item, highlight });
  }
  let html = '';
  let listHtml = '';
  kiwiSections.forEach((sec, i) => {
    const sectionItems = sections[sec.id]; if (!sectionItems || !sectionItems.length) return;
    listHtml += `<div class="section-header">${h(sec.label)}</div>`;
    sectionItems.forEach(item => listHtml += renderItem(item, currentStore));
  });
  if (unknown.length) { listHtml += '<div class="section-header">Ukjent plassering</div>'; unknown.forEach(item => listHtml += renderItem(item, currentStore)); }
  if (vogna.length) { listHtml += '<div class="section-header in-vogna">Vogna</div>'; vogna.forEach(item => listHtml += renderItem(item, currentStore, true)); }
  if (!listHtml && !hasActiveOccasionFilters()) listHtml = `<div class="empty-state"><div class="emoji">&#128722;</div><p>${primaryEmptyText()}</p></div>`;
  if (!listHtml && hasActiveOccasionFilters()) listHtml = `<div class="empty-state"><p>${storeOccasionEmptyText()}</p></div>`;
  container.innerHTML = html + listHtml;
  attachEvents();
}
function toggleAndreSection(secId) { if (collapsedSections.has(secId)) collapsedSections.delete(secId); else collapsedSections.add(secId); renderList(); }
function renderAndre(container, items) {
  const sections = {}, unknown = [], vogna = [];
  for (const item of items) {
    if (item.store !== 'andre') continue;
    const saved = getSavedPlacement(item.text);
    const sectionId = item.andreSection || saved?.andreSection || null;
    if (item.checked) { vogna.push({ ...item, sectionId }); continue; }
    if (sectionId) { if (!sections[sectionId]) sections[sectionId] = []; sections[sectionId].push({ ...item, sectionId }); }
    else unknown.push({ ...item });
  }
  let html = '';
  let listHtml = '';
  andreSections.forEach(sec => {
    const sectionItems = sections[sec.id]; if (!sectionItems || !sectionItems.length) return;
    const collapsed = collapsedSections.has(sec.id);
    listHtml += `<div class="section-header andre-collapsible" onclick="toggleAndreSection('${h(sec.id)}')" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;"><span>${h(sec.label)} <span style="font-weight:400;opacity:0.6">&middot; ${sectionItems.length}</span></span><span style="font-size:0.7rem">${collapsed ? '▶' : '▼'}</span></div>`;
    if (!collapsed) sectionItems.forEach(item => listHtml += renderItem(item, 'andre'));
  });
  if (unknown.length) { listHtml += '<div class="section-header">Ikke plassert</div>'; unknown.forEach(item => listHtml += renderItem(item, 'andre')); }
  if (vogna.length) { listHtml += '<div class="section-header in-vogna">Vogna</div>'; vogna.forEach(item => listHtml += renderItem(item, 'andre', true)); }
  if (!listHtml) listHtml = hasActiveOccasionFilters() ? `<div class="empty-state"><p>${storeOccasionEmptyText()}</p></div>` : '<div class="empty-state"><div class="emoji">&#127970;</div><p>Ingen varer lagt til for Andre butikker her.</p></div>';
  container.innerHTML = html + listHtml;

function renderBeredskap(container, items) {
  const active = [], vogna = [];

    if (item.checked) vogna.push(item); else active.push(item);

  let listHtml = '';
  active.forEach(item => listHtml += renderItem(item, 'beredskap'));
  if (vogna.length) {
    listHtml += '<div class="section-header in-vogna">Vogna</div>';
    vogna.forEach(item => listHtml += renderItem(item, 'beredskap', true));

  if (!listHtml) listHtml = '<div class="empty-state"><div class="emoji">&#128270;</div><p>Ingen beredskapsvarer enn&aring;. Trykk <strong>+</strong> for &aring; legge til.</p></div>';

function updateOccasionBadge() {
  const b = document.getElementById('occasionBadge');

  b.textContent = n ? String(n) : '';
  b.style.display = n ? 'inline-flex' : 'none';

function renderItem(item, store, inVogna = false) {
  const highlight = item.highlight && !inVogna ? 'highlighted' : '';
  const vognaClass = inVogna ? 'in-vogna' : '';

function attachEvents() {
  document.querySelectorAll('.item-main').forEach(main => {
    main.addEventListener('click', e => {
      if (e.target.closest('.edit-zone')) return;
      const row = main.closest('.item-row');

function renderSectionOptions(item) {
  const isAndre = item.store === 'andre';
  const sections = isAndre ? andreSections : kiwiSections;
  const saved = getSavedPlacement(item.text);
  const curSection = isAndre ? (item.andreSection || saved?.andreSection || null) : (item.kiwiSection || saved?.kiwiSection || null);

function setItemStore(itemId, store) {

  openItemDrawer(itemId);

}
function assignItemSection(sectionId) {
  const item = listItems.find(i => i.id === activeItemId);
  if (!item) return;
  const value = sectionId || null;
  if (item.store === 'andre') item.andreSection = value; else item.kiwiSection = value;
  rememberPlacement(item);
  renderSectionOptions(item);
  renderList(); scheduleSave();
}
function saveItemDetails() {
  const item = listItems.find(i => i.id === activeItemId);
  if (!item) return;
  const name = document.getElementById('itemNameInput').value.trim();
  if (name) item.text = name;
  item.occasionId = document.getElementById('itemOccasionSelect')?.value || null;
  rememberPlacement(item);
  closeSectionModal(); scheduleSave();
}
function closeSectionModal() { document.getElementById('sectionModal').classList.remove('open'); activeItemId = null; renderList(); }

// CATEGORY EDITOR
function renderCatEditor(type) {
  const sections = type === 'andre' ? andreSections : kiwiSections;
  const listId = type === 'andre' ? 'andreCatList' : 'kiwiCatList';
  const list = document.getElementById(listId);
  list.innerHTML = sections.map((sec, i) => `<div class="cat-row" data-idx="${i}" data-type="${type}"><div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0;"><button class="cat-move-btn" onclick="moveCat(${i},-1,'${type}')" ${i===0?'disabled':''}>▲</button><button class="cat-move-btn" onclick="moveCat(${i},1,'${type}')" ${i===sections.length-1?'disabled':''}>▼</button></div><span style="color:var(--muted);font-size:0.78rem;flex-shrink:0;min-width:16px">${i}</span><input class="cat-name-input" value="${h(sec.label)}" data-idx="${i}" data-type="${type}" onchange="getSections('${type}')[${i}].label=this.value"><button class="cat-delete-btn" onclick="deleteCat(${i},'${type}')">×</button></div>`).join('');
}
function moveCat(idx, dir, type) { const sections = getSections(type); const newIdx = idx + dir; if (newIdx < 0 || newIdx >= sections.length) return; const moved = sections.splice(idx, 1)[0]; sections.splice(newIdx, 0, moved); renderCatEditor(type); }
function getSections(type) { return type === 'andre' ? andreSections : kiwiSections; }
function addCat(type) { const sections = getSections(type); const prefix = type === 'andre' ? 'a' : 'k'; sections.push({ id: prefix + '_' + Date.now(), label: 'Ny', keywords: [] }); renderCatEditor(type); }
function deleteCat(idx, type) { getSections(type).splice(idx, 1); renderCatEditor(type); }
function saveCats(type) { const listId = type === 'andre' ? 'andreCatList' : 'kiwiCatList'; document.querySelectorAll(`#${listId} .cat-name-input`).forEach(input => { const idx = parseInt(input.dataset.idx, 10); const sections = getSections(type); if (sections[idx]) sections[idx].label = input.value; }); closePanel(); renderList(); scheduleSave(); }
function dragStart(e, idx, type) { dragSrcIdx = idx; e.dataTransfer.effectAllowed = 'move'; }
function dragOver(e, idx, type) { e.preventDefault(); }
function dragDrop(e, idx, type) { e.preventDefault(); if (dragSrcIdx === null || dragSrcIdx === idx) return; const sections = getSections(type); const moved = sections.splice(dragSrcIdx, 1)[0]; sections.splice(idx, 0, moved); renderCatEditor(type); }
function dragEnd(type) { dragSrcIdx = null; }

// MAINTENANCE / EXPORT
function toemVogna() {
  listItems = listItems.filter(i => !i.checked || !isInActiveShoppingScope(i));
  renderList(); scheduleSave();
}
function nyHandel() { document.getElementById('confirmModal').classList.remove('open'); listItems = []; renderList(); scheduleSave(); }
function renderMaintenance() {
  const el = document.getElementById('maintenancePanel');
  if (!el) return;
  const placements = Object.entries(preferences.itemPlacements || {}).sort(([a],[b]) => a.localeCompare(b));
  const filtered = placements.filter(([key]) => key.includes(placementSearch.toLowerCase().trim())).slice(0, 80);
  const dataSize = bytesOf(JSON.stringify({ items: listItems, occasions, occasionTodos, contexts, categories: { kiwi: kiwiSections, andre: andreSections }, preferences }));
  el.innerHTML = `<div class="maintenance-card"><h2>Status</h2><div class="maintenance-grid"><div class="metric"><strong>${listItems.length}</strong><span>varer</span></div><div class="metric"><strong>${occasions.length}</strong><span>anledninger</span></div><div class="metric"><strong>${occasionTodos.length}</strong><span>todoer</span></div><div class="metric"><strong>${placements.length}</strong><span>lærte plasseringer</span></div><div class="metric"><strong>${Math.round(dataSize/1024)} KB</strong><span>payload</span></div><div class="metric"><strong>${contexts.length}</strong><span>kontekster</span></div></div><p class="panel-help">Desktop-vedlikehold for å rydde feil i lærte plasseringer og se om payloaden er blitt stor.</p></div><div class="maintenance-card"><h2>Lærte plasseringer</h2><input class="text-input" placeholder="Søk..." value="${h(placementSearch)}" oninput="placementSearch=this.value;renderMaintenance()"><div style="margin-top:10px">${filtered.map(([key, p]) => `<div class="placement-row"><div><strong>${h(key)}</strong><div class="placement-meta">${h(p.store || '-')}${p.kiwiSection?' / '+h(p.kiwiSection):''}${p.andreSection?' / '+h(p.andreSection):''}</div></div><button class="tiny-btn" onclick="deletePlacement('${h(key)}')">Slett</button></div>`).join('') || '<p class="panel-help">Ingen treff.</p>'}</div><div class="panel-actions"><button class="action-btn secondary" onclick="pruneBrokenPlacements()">Rydd tomme</button><button class="action-btn secondary" onclick="clearAllPlacements()">Slett alle</button></div></div><div class="maintenance-card"><h2>Ytelseslogg</h2>${perfLog.map(p => `<div class="placement-row"><div><strong>${h(p.label)}</strong><div class="placement-meta">${h(p.at)} ${h(p.extra)}</div></div></div>`).join('') || '<p class="panel-help">Ingen målinger ennå.</p>'}</div>`;
}
function deletePlacement(key) { delete preferences.itemPlacements[key]; renderMaintenance(); scheduleSave(); }
function pruneBrokenPlacements() { let count = 0; Object.keys(preferences.itemPlacements || {}).forEach(key => { const p = preferences.itemPlacements[key] || {}; if (!p.store && !p.kiwiSection && !p.andreSection) { delete preferences.itemPlacements[key]; count++; } }); alert('Ryddet ' + count + ' tomme plasseringer.'); renderMaintenance(); scheduleSave(); }
function clearAllPlacements() { if (!confirm('Slette alle lærte plasseringer?')) return; preferences.itemPlacements = {}; renderMaintenance(); renderList(); scheduleSave(); }
function doExport() { document.getElementById('exportText').value = JSON.stringify({ items: listItems, occasions, occasionTodos, contexts, kiwi: kiwiSections, andre: andreSections, preferences }, null, 2); }
function copyExport() { if (!document.getElementById('exportText').value) doExport(); const ta = document.getElementById('exportText'); ta.select(); document.execCommand('copy'); const btn = document.querySelector('#tab-export .action-btn.secondary'); const old = btn.textContent; btn.textContent = 'Kopiert'; setTimeout(() => btn.textContent = old, 2000); }
function doImport() { try { const p = JSON.parse(document.getElementById('importText').value.trim()); if (p.items) listItems = p.items; if (p.occasions) occasions = p.occasions; if (p.occasionTodos) occasionTodos = p.occasionTodos; if (p.contexts) contexts = p.contexts; if (p.kiwi) kiwiSections.splice(0, kiwiSections.length, ...p.kiwi); if (p.andre) andreSections.splice(0, andreSections.length, ...p.andre); if (p.preferences) preferences = p.preferences; normalizeState(); document.getElementById('importText').value = ''; closePanel(); renderList(); scheduleSave(); } catch(e) { alert('Feil format.'); } }

// Legacy stubs
function openStorePicker() {}
function closeStoreModal() { closeSectionModal(); }
function openSectionPicker() {}
function setStoreForItem() {}
function assignSection() {}
function guessSection(text, sections) { return null; }

if (savedRoom) {
  document.getElementById('roomScreen').classList.add('hidden');
  document.getElementById('roomCodeInput').value = savedRoom;
  joinRoom();
}

</script>
